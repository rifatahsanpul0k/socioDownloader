[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
dirs = "=6.0.0"
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow"] }
reqwest = { version = "=0.11.27", default-features = false, features = ["rustls-tls", "stream"] }
scraper = "=0.22.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
arboard = "=3.4.1"
thiserror = "=1.0.69"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "=2.4.1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
